<!doctype html>
<!-- Plantilla de la imagen que sale al compartir el enlace (WhatsApp, LinkedIn, X...).
     La convierte en public/images/kuova-og.jpg el script scripts/make-og.py.
     Mismo fondo de seda que la portada (components/prelaunch/SilkBackground.tsx), quieto. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&family=Playfair+Display:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0e2a24; }
  canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
  .veil { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(9,29,25,0.62) 0%, rgba(9,29,25,0.22) 45%, transparent 72%); }
  /* Todo en el centro: WhatsApp a veces recorta la imagen en cuadrado y así el logo siempre se ve */
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgb(250 248 243); }
  .wordmark { height: 82px; width: auto; }
  .health { margin-top: 22px; padding-left: 0.6em; font: 500 22px "Montserrat", sans-serif; letter-spacing: 0.6em; color: rgb(201 163 107); }
  .lema { margin-top: 46px; font: 400 52px "Playfair Display", serif; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<div class="veil"></div>
<div class="content">
  <svg class="wordmark" viewBox="226 189 1556 276" fill="currentColor">
    <path d="M230 200H268V327L427 200H490L333.67 315.49L480 457H424L302.58 338.45L268 364V402C267 430 250 450 230 457Z" />
    <path d="M561.5 198v141a103.5 103.5 0 0 0 207 0V198" fill="none" stroke="currentColor" stroke-width="37" />
    <ellipse cx="990.5" cy="326.5" rx="126.5" ry="116.5" fill="none" stroke="currentColor" stroke-width="38" />
    <path d="M1167 196h41l109 214 116-214h42l-142 260h-32Z" />
    <path d="M1593 196h39l146 261h-43l-123-214-128 214h-43Z" />
  </svg>
  <div class="health">HEALTH</div>
  <div class="lema">Know more. Live better.</div>
</div>
<script>
  const VERTEX = "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }";
  const FRAGMENT = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
float h(vec2 p, float t) {
  float v = 0.55 * sin(p.x * 1.10 + t * 0.70 + 1.70 * sin(p.y * 0.80 - t * 0.40));
  v += 0.30 * sin(p.x * 1.90 - p.y * 1.30 + t * 0.50 + 0.90 * sin(p.x * 0.60 + t * 0.30));
  v += 0.15 * sin(p.y * 2.70 + p.x * 0.50 - t * 0.60);
  return v;
}
void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y) * 3.6;
  p = mat2(0.82, -0.57, 0.57, 0.82) * p;
  float e = 0.004;
  float c = h(p, u_time);
  vec2 g = vec2(h(p + vec2(e, 0.0), u_time) - c, h(p + vec2(0.0, e), u_time) - c) / e;
  vec3 n = normalize(vec3(-g * 0.7, 1.0));
  vec3 l = normalize(vec3(-0.45, 0.55, 0.70));
  float diff = clamp(dot(n, l), 0.0, 1.0);
  float spec = pow(clamp(dot(n, normalize(l + vec3(0.0, 0.0, 1.0))), 0.0, 1.0), 90.0);
  vec3 deep = vec3(0.025, 0.090, 0.078);
  vec3 green = vec3(0.055, 0.165, 0.141);
  vec3 lift = vec3(0.150, 0.330, 0.275);
  vec3 sage = vec3(0.560, 0.660, 0.600);
  vec3 gold = vec3(0.788, 0.639, 0.420);
  vec3 col = mix(deep, green, smoothstep(0.2, 0.8, diff));
  col = mix(col, lift, pow(diff, 8.0) * 0.9);
  col += spec * mix(sage, gold, 0.6) * 0.75;
  float vignette = smoothstep(1.25, 0.25, length((uv - 0.5) * vec2(1.3, 1.0)));
  col *= mix(0.6, 1.0, vignette);
  gl_FragColor = vec4(col, 1.0);
}`;
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERTEX));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAGMENT));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, 1200, 630);
  gl.uniform2f(gl.getUniformLocation(prog, "u_res"), 1200, 630);
  // Fotograma elegido a ojo (?t= en la URL para probar otros)
  const t = Number(new URLSearchParams(location.search).get("t") ?? 46);
  gl.uniform1f(gl.getUniformLocation(prog, "u_time"), t * 0.18);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
</script>
</body>
</html>
